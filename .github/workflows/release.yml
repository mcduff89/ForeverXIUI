# Makes a GitHub release whenever the version in ForeverXIUI/ForeverXIUI.toc changes.
# Push as usual from GitHub Desktop: if "## Version" is new, this zips the ForeverXIUI
# addon folder (plus README and LICENSE, no backups) as ForeverXIUI-<version>.zip and
# publishes it as release v<version>. Pushes that don't change the version do nothing.
name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          version=$(grep -m1 '^## Version:' ForeverXIUI/ForeverXIUI.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p build
          cp -r ForeverXIUI build/
          cp README.md LICENSE build/ForeverXIUI/
          find build -name '*_backup.*' -delete
          cd build && zip -qr "../ForeverXIUI-${{ steps.v.outputs.version }}.zip" ForeverXIUI

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          v="${{ steps.v.outputs.version }}"
          change=$(grep -m1 "^- $v " README.md || echo "ForeverXIUI $v")
          repo="https://github.com/${{ github.repository }}"
          raw="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          notes=$(printf '%s\n\n![ForeverXIUI](%s/screenshots/overview.jpg)\n\n**Install:** download `ForeverXIUI-%s.zip` below and extract it into `World of Warcraft\\_forever_\\Interface\\AddOns`. Screenshots and every feature: [README](%s#readme)\n' "$change" "$raw" "$v" "$repo")
          gh release create "v$v" "ForeverXIUI-$v.zip" --title "ForeverXIUI $v" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
